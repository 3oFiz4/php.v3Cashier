<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Cashier</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-brand">
        <span>v2Cashier</span>
      </div>
      <div class="nav-actions">
        <span
          id="clock"
          style="font-size: 0.85rem; color: #6b7280; font-weight: 500"
        ></span>
        <a href="login.html" class="btn btn-sm">Admin Login</a>
      </div>
    </nav>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Products Panel -->
      <div class="products-panel">
        <!-- Search & Filter -->
        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search products..."
          />
          <select id="categoryFilter" class="filter-select">
            <option value="all">All Categories</option>
          </select>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productsGrid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Cart Panel -->
      <div class="cart-panel">
        <div class="cart-card">
          <div class="cart-header">
            <h3>Shopping Cart</h3>
            <span class="cart-count" id="cartCount">0</span>
          </div>

          <div class="cart-items" id="cartItems">
            <div class="cart-empty">
              <span>Cart is empty</span>
              <span style="font-size: 0.8rem">Click a product to add it</span>
            </div>
          </div>

          <div class="cart-footer">
            <div class="cart-total">
              <span class="cart-total-label">Total</span>
              <span class="cart-total-amount" id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="paymentModal">
      <div class="modal">
        <div class="modal-header">
          <h3>💳 Payment</h3>
          <button class="modal-close" onclick="closePaymentModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="payment-summary" id="paymentSummary"></div>
          <div class="form-group">
            <label class="form-label">Payment Amount ($)</label>
            <input
              type="number"
              id="paymentInput"
              class="form-input payment-input"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
          </div>
          <div class="payment-row change" id="changeRow" style="display: none">
            <span>Change</span>
            <span id="changeAmount">$0.00</span>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closePaymentModal()">Cancel</button>
          <button
            class="btn btn-dark"
            id="confirmPayBtn"
            onclick="confirmPayment()"
            disabled
          >
            Confirm Payment
          </button>
        </div>
      </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal-overlay" id="receiptModal">
      <div class="modal" style="max-width: 400px">
        <div class="modal-header">
          <h3>🧾 Receipt</h3>
          <button class="modal-close" onclick="closeReceiptModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="receipt" id="receiptContent"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeReceiptModal()">Close</button>
          <button class="btn btn-dark" onclick="printReceipt()">
            🖨️ Print Receipt
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
