<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - POS Cashier</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="login-container">
      <div class="card login-card">
        <div style="text-align: center; margin-bottom: 2rem">
          <h2 style="font-size: 1.5rem; font-weight: 700">Admin Login</h2>
          <p style="color: #6b7280; font-size: 0.9rem; margin-top: 0.5rem">
            POS Cashier Management
          </p>
        </div>

        <div
          id="loginError"
          style="
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
          "
        ></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Enter username"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
          </div>
          <button
            type="submit"
            class="btn btn-dark"
            style="width: 100%; padding: 0.85rem; margin-top: 0.5rem"
          >
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem">
          <a
            href="index.html"
            style="color: #6b7280; font-size: 0.85rem; text-decoration: none"
          >
            ← Back to Cashier
          </a>
        </div>

        <div
          style="
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
          "
        >
          <p style="color: #9ca3af; font-size: 0.8rem">
            btw the pass is: admin / admin123
          </p>
        </div>
      </div>
    </div>

    <script src="../js/login.js"></script>
  </body>
</html>
